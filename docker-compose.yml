version: '3.7'

services:
  ollama:
    image: cecemel/app-ollama-experiment-ollama:0.0.1
    build: ./config/ollama/
    environment:
      MODEL: "llama3.2:3b"
      # tool-calling needs > Ollama's 4096 default; lower to 16384 if RAM-tight
      OLLAMA_CONTEXT_LENGTH: "32768"
    volumes:
      - ./data:/root/.ollama
  agent:
    image: cecemel/app-ollama-experiment-agent:0.0.1
    build: ./config/agent/
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      MODEL: "llama3.2:3b"
    volumes:
      - ./config/agent/agent.py:/app/agent.py

  opencode:
    image: cecemel/app-ollama-experiment-opencode:0.0.1
    build: ./config/opencode/
    environment:
      OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT: "true"
      # Log full chat input/output to `docker compose logs opencode`. Set "false" to disable.
      OPENCODE_LOG_CHAT: "true"
      CHAT_LOG_MAXLEN: "0" # unlimited chat logs in docker compose
      # User-Agent for opencode's webfetch tool (overridden by a custom tool to look like Firefox)
      WEBFETCH_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:141.0) Gecko/20100101 Firefox/141.0"
      OLLAMA_LOCAL_MODELS: |
        {
          "llama3.2:3b": { "tools": true }
        }
      OLLAMA_CLOUD_MODELS: |
        {
          "qwen3-coder:480b": { "tools": true },
          "gpt-oss:120b": { "tools": true },
          "glm-5.2": { "tools": true },
          "qwen3.6:35b":  { "tools": true }
        }
    volumes:
      # persist opencode state across restarts: sessions/history + auth (the db),
      # and the auto-installed provider package. config.json is regenerated each boot.
      - ./data/opencode/share:/root/.local/share/opencode
      - ./data/opencode/config:/root/.config/opencode
