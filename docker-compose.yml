version: '3.7'

services:
  ollama:
    image: cecemel/app-ollama-experiment-ollama:0.0.1
    build: ./config/ollama/
    environment:
      MODEL: "llama3.2:3b"
      # tool-calling needs > Ollama's 4096 default; lower to 16384 if RAM-tight
      OLLAMA_CONTEXT_LENGTH: "32768"
    volumes:
      - ./data:/root/.ollama
  agent:
    image: cecemel/app-ollama-experiment-agent:0.0.1
    build: ./config/agent/
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      MODEL: "llama3.2:3b"
    volumes:
      - ./config/agent/agent.py:/app/agent.py

  aider:
    image: cecemel/app-ollama-experiment-aider:0.0.1
    build: ./config/aider/
    environment:
      OLLAMA_API_BASE: "http://ollama:11434"
      AIDER_MODEL: "ollama/llama3.2:3b"

  opencode:
    image: cecemel/app-ollama-experiment-opencode:0.0.1
    build: ./config/opencode/
    environment:
      OPENCODE_CONFIG_CONTENT: |
        {
          "model": "ollama/llama3.2:3b",
          "small_model": "ollama/llama3.2:3b",
          "provider": {
            "ollama": {
              "npm": "@ai-sdk/openai-compatible",
              "options": { "baseURL": "http://ollama:11434/v1" },
              "models": { "llama3.2:3b": { "tools": true } }
            }
          }
        }
