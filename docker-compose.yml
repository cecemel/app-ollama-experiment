services:
  ollama-local:
    image: cecemel/app-ollama-experiment-ollama-local:0.0.1
    build: ./config/ollama/
    environment:
      MODEL: "llama3.2:3b"
      OLLAMA_CONTEXT_LENGTH: "32768"
    volumes:
      - ./data:/root/.ollama
  agent:
    image: cecemel/app-ollama-experiment-agent:0.0.1
    build: ./config/agent/
    environment:
      OLLAMA_HOST: "http://ollama-local:11434"
      MODEL: "llama3.2:3b"
    volumes:
      - ./config/agent/agent.py:/app/agent.py

  opencode:
    image: cecemel/app-ollama-experiment-opencode:0.0.1
    build: ./config/opencode/
    # "host" -> host-gateway so the "localhost-gateway" provider can reach
    # services bound on the host's localhost (port baked into the image at
    # config/opencode/opencode.base.json). Register models in docker-compose.override.yml.
    # Note if you want ssh-tunnels to work, you need to update the config of the tunnel that it accepts connections from outside 127.0.0.0
    extra_hosts:
      - "host:host-gateway"
    environment:
      OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT: "true"
      OPENCODE_LOG_CHAT: "true"
      CHAT_LOG_MAXLEN: "0"
      # Password for `opencode serve`. Change it in docker-compose.override.yml;
      # it must match the openchamber service's OPENCODE_SERVER_PASSWORD.
      OPENCODE_SERVER_PASSWORD: "opencode"
      WEBFETCH_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:141.0) Gecko/20100101 Firefox/141.0"
      OLLAMA_LOCAL_MODELS: |
        {
          "llama3.2:3b": { "tools": true }
        }
      OLLAMA_CLOUD_MODELS: |
        {
          "qwen3-coder:480b": { "tools": true },
          "gpt-oss:120b": { "tools": true },
          "glm-5.2": { "tools": true },
          "qwen3.6:35b":  { "tools": true },
          "glm-5.3-flash:cloud": {
            "tools": true,
            "reasoning": true,
            "interleaved": "reasoning_content", # it *should* have something to do with reasoning, but no idea..
            "variants": {
              "max":  { "reasoningEffort": "max" },
              "high": { "reasoningEffort": "high" }
            }
          }
        }
      PRISM_MODELS: |
        {
          "bonsai-27b-1bit": { "tools": true }
        }
    volumes:
      # TODO: check if we have less bias in the conversations accross sessions
      #- ./data/opencode-light/share:/root/.local/share/opencode
      - ./data/opencode/config:/root/.config/opencode

  opencode-light:
    image: cecemel/app-ollama-experiment-opencode-light:0.0.1
    build: ./config/opencode-light/
    # "host" -> host-gateway so the "localhost-gateway" provider can reach
    # services bound on the host's localhost (port baked into the image at
    # config/opencode-light/opencode.base.json). Register models in docker-compose.override.yml.
    extra_hosts:
      - "host:host-gateway"
    environment:
      OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT: "true"
      OPENCODE_LOG_CHAT: "true"
      CHAT_LOG_MAXLEN: "0"
      WEBFETCH_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:141.0) Gecko/20100101 Firefox/141.0"
      OLLAMA_LOCAL_MODELS: |
        {
          "llama3.2:3b": { "tools": true }
        }
      OLLAMA_CLOUD_MODELS: |
        {
          "qwen3-coder:480b": { "tools": true },
          "gpt-oss:120b": { "tools": true },
          "glm-5.2": { "tools": true },
          "qwen3.6:35b":  { "tools": true },
          "glm-5.3-flash:cloud": {
            "tools": true,
            "reasoning": true,
            "interleaved": "reasoning_content", # it *should* have something to do with reasoning, but no idea..
            "variants": {
              "max":  { "reasoningEffort": "max" },
              "high": { "reasoningEffort": "high" }
            }
          }
        }
      PRISM_MODELS: |
        {
          "bonsai-27b-1bit": { "tools": true }
        }
    volumes:
      # TODO: check if we have less bias in the conversations accross sessions
      #- ./data/opencode-light/share:/root/.local/share/opencode
      - ./data/opencode-light/config:/root/.config/opencode
  llama-prism:
    image: cecemel/app-ollama-experiment-llama-prism:0.0.1
    build:
      context: ./config/llama-prism/
      args:
        BACKEND: "cpu"
        RELEASE_TAG: "prism-b9596-9fcaed7"
    environment:
      PRISM_MODEL: "prism-ml/Bonsai-27B-gguf:Q1_0"
      LLAMA_NGL: "99"
      LLAMA_CONTEXT: "32768"
      LLAMA_ALIAS: "bonsai-27b-1bit"
    volumes:
      - ./data/llama-prism:/data

  openchamber:
    image: cecemel/app-ollama-experiment-openchamber:0.0.1
    build: ./config/openchamber/
    # Web UI for opencode. Connects to the opencode service's server (opencode
    # serve on :4096, see config/opencode/start.sh). Bring opencode up first.
    # The relay URL is deploy-specific: set OPENCHAMBER_RELAY_URL in
    # docker-compose.override.yml. Publish port 3000 yourself (e.g. in the
    # override) if you want the UI on the host.
    environment:
      OPENCODE_HOST: "http://opencode:4096"
      OPENCODE_SKIP_START: "true"
      # Must match the opencode service's OPENCODE_SERVER_PASSWORD. Change it in
      # docker-compose.override.yml.
      OPENCODE_SERVER_PASSWORD: "opencode"
      OPENCHAMBER_HOST: "0.0.0.0"
      # Change me in docker-compose.override.yml (needed since we bind 0.0.0.0).
      OPENCHAMBER_UI_PASSWORD: "openchamber"
      # OPENCHAMBER_RELAY_URL: set in docker-compose.override.yml (deploy-specific)
    volumes:
      - ./data/openchamber:/root/.config/openchamber
  openchamber-relay:
    image: cecemel/app-ollama-experiment-openchamber-relay:0.0.1
    build: ./config/openchamber-relay/
    # Self-hosted OpenChamber private relay. Listens on :80 inside the container
    # (EXPOSE 80 in the Dockerfile). Publish the port yourself (e.g. in
    # docker-compose.override.yml) and put your own TLS termination in front, so
    # clients reach it at wss://relay.example.com/ws. Stateless E2EE broker, no
    # secrets. Optional usage accounting: set RELAY_USAGE_DB and mount /data.
